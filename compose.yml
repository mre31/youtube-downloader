services:
  youtube-downloader:
    image: ${APP_IMAGE:-youtube-downloader:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5055}:5055"
    volumes:
      - downloads:/app/temp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  downloads:
